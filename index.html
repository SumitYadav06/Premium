  <body class="bg-slate-950 text-white antialiased overflow-x-hidden selection:bg-purple-500 selection:text-white">
    <div id="root"></div>
    <div id="aj-boot">
      <div class="aj-brand">Apna Jugaad</div>
      <div class="aj-spin" id="aj-boot-spin"></div>
      <div class="aj-sub" id="aj-boot-sub">Store khul raha hai…</div>
      <div id="aj-boot-retry">
        <p>Internet slow lag raha hai. Ek baar phir try karo:</p>
        <button onclick="window.__ajRetry()">Dobara Try Karo</button>
      </div>
    </div>
    <script>
      (function () {
        window.__ajRetry = function () {
          try { sessionStorage.removeItem('aj_boot_tries'); } catch (e) {}
          location.replace(location.origin + location.pathname + '?aj_boot=' + Date.now());
        };
        setTimeout(function () {
          if (window.__AJ_BOOTED) return;
          var tries = 0;
          try { tries = +(sessionStorage.getItem('aj_boot_tries') || 0); } catch (e) {}
          if (tries < 2) {
            try { sessionStorage.setItem('aj_boot_tries', String(tries + 1)); } catch (e) {}
            location.replace(location.origin + location.pathname + '?aj_boot=' + Date.now());
          } else {
            var r = document.getElementById('aj-boot-retry');
            var s = document.getElementById('aj-boot-spin');
            var sub = document.getElementById('aj-boot-sub');
            if (r) r.style.display = 'block';
            if (s) s.style.display = 'none';
            if (sub) sub.style.display = 'none';
          }
        }, 9000);
      })();
    </script>
