name: Build Live Sync Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.3.2 @capacitor/cli@8.3.2 @capacitor/android@8.3.2

      - name: Create temporary web directory
        run: |
          rm -rf dist
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Premium App Store</title>
          </head>
          <body>
            <p>Loading...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.premium.app",
            "appName": "Premium App Store",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": false,
              "allowNavigation": [
                "sumityadav06.github.io"
              ]
            }
          }
          EOF

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Set Android app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="Premium App Store"'
          )

          manifest.write_text(text)
          PY

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ]

          for permission in permissions:
              permission_name = permission.split('android.permission.')[1].split('"')[0]

              if f'android.permission.{permission_name}' not in text:
                  text = text.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          manifest.write_text(text)

          print("Internet, network and microphone permissions added.")
          PY

      - name: Add custom app icon
        run: |
          mkdir -p android/app/src/main/res/drawable

          cp app-icon.png android/app/src/main/res/drawable/app_icon.png

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/app_icon"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/app_icon"'
          )

          manifest.write_text(text)
          PY

          echo "Custom Premium App Store icon added."

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Confirm microphone permission after sync
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          manifest.write_text(text)

          print("Microphone permission confirmed.")
          PY

      - name: Confirm custom icon after sync
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp app-icon.png android/app/src/main/res/drawable/app_icon.png

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/app_icon"'
          )

          text = text.replace(
              'android:roundIcon="@mipmap/ic_launcher_round"',
              'android:roundIcon="@drawable/app_icon"'
          )

          text = text.replace(
              'android:label="@string/app_name"',
              'android:label="Premium App Store"'
          )

          manifest.write_text(text)
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-App-Store-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
