name: Build Live Sync Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android App
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          mkdir -p dist
          echo "<html><body>Loading...</body></html>" > dist/index.html
          
          npx cap init "PremiumApp" "com.premium.app" --web-dir dist
          
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.premium.app",
            "appName": "PremiumApp",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": true
            }
          }
          EOF

          npx cap add android
          npx cap copy android
          
          # इंटरनेट परमिशन जोड़ना ताकि ऐप लाइव वेबसाइट लोड कर सके
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          
          npx cap update android
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
