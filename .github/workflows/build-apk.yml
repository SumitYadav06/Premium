name: Build Live Sync Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert --version

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.3.2 @capacitor/cli@8.3.2 @capacitor/android@8.3.2

      - name: Create temporary web files
        run: |
          rm -rf dist
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Premium App Store</title>
          </head>
          <body>
            <p>Loading...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.premium.app",
            "appName": "Premium App Store",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": false,
              "allowNavigation": [
                "sumityadav06.github.io"
              ]
            }
          }
          EOF

      - name: Add Android
        run: |
          rm -rf android
          npx cap add android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.REQUEST_INSTALL_PACKAGES"
          ]

          marker = "<application"

          permission_lines = "".join(
              f'    <uses-permission android:name="{perm}" />\n'
              for perm in permissions
          )

          # Remove existing copies first so the step is always clean
          import re

          for perm in permissions:
              s = re.sub(
                  rf'\s*<uses-permission android:name="{re.escape(perm)}"\s*/>',
                  '',
                  s
              )

          if marker not in s:
              raise RuntimeError("AndroidManifest.xml: <application> not found")

          s = s.replace(
              marker,
              permission_lines + marker,
              1
          )

          p.write_text(s)
          print("Android permissions configured.")
          PY

      - name: Set application icon
        run: |
          if [ ! -f "app-icon.png" ]; then
            echo "ERROR: app-icon.png not found in repository root."
            exit 1
          fi

          echo "Using repository icon: app-icon.png"

          RES="android/app/src/main/res"

          # Remove Capacitor/Android generated launcher icons.
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi"

          # Create all required density folders.
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Generate launcher icons directly from app-icon.png.
          convert app-icon.png -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert app-icon.png -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert app-icon.png -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert app-icon.png -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert app-icon.png -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          # Round launcher icon uses the exact same image.
          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          echo "Launcher icons generated successfully."

      - name: Force launcher icon in AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          # Make sure application uses our PNG launcher icon.
          s = re.sub(
              r'<application([^>]*)android:icon="[^"]*"',
              r'<application\1android:icon="@mipmap/ic_launcher"',
              s,
              count=1
          )

          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s = s.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          # Force the round icon too.
          if 'android:roundIcon=' in s:
              s = re.sub(
                  r'android:roundIcon="[^"]*"',
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  s,
                  count=1
              )
          else:
              s = s.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@mipmap/ic_launcher" '
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          p.write_text(s)
          print("Manifest launcher icon configured.")
          PY

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify launcher icon
        run: |
          echo "Checking launcher icons..."
          find android/app/src/main/res \
            -type f \
            \( -name "ic_launcher.png" -o -name "ic_launcher_round.png" \) \
            -print

          echo "Checking manifest..."
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml || true
          grep -n "android:icon" android/app/src/main/AndroidManifest.xml || true
          grep -n "android:roundIcon" android/app/src/main/AndroidManifest.xml || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-App-Store-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
