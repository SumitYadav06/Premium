name: Build Live Sync Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.3.2 @capacitor/cli@8.3.2 @capacitor/android@8.3.2

      - name: Create temporary web directory
        run: |
          rm -rf dist
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>PremiumApp</title>
          </head>
          <body>
            <p>Loading...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.premium.app",
            "appName": "PremiumApp",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": false,
              "allowNavigation": [
                "sumityadav06.github.io"
              ]
            }
          }
          EOF

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Add microphone and internet permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ]

          for permission in permissions:
              permission_name = permission.split('android.permission.')[1].split('"')[0]

              if f'android.permission.{permission_name}' not in text:
                  text = text.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          manifest.write_text(text)

          print("Required Android permissions added successfully.")
          PY

      - name: Configure MainActivity
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main -type f -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          cat > "$MAIN_ACTIVITY" <<'EOF'
          package com.premium.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {

              private static final String LIVE_URL =
                      "https://sumityadav06.github.io/Premium/";

              private static final int MICROPHONE_PERMISSION_REQUEST = 2001;

              private PermissionRequest pendingMicrophoneRequest;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = getBridge().getWebView();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebChromeClient(
                      new BridgeWebChromeClient(getBridge()) {

                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {

                              String[] resources = request.getResources();

                              boolean audioRequested = false;
                              boolean videoRequested = false;

                              for (String resource : resources) {

                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                      audioRequested = true;
                                  }

                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                                      videoRequested = true;
                                  }
                              }

                              if (audioRequested && !videoRequested) {

                                  String origin = request.getOrigin().toString();

                                  if (!origin.startsWith(
                                          "https://sumityadav06.github.io/"
                                  )) {
                                      request.deny();
                                      return;
                                  }

                                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M ||
                                      ContextCompat.checkSelfPermission(
                                          MainActivity.this,
                                          Manifest.permission.RECORD_AUDIO
                                      ) == PackageManager.PERMISSION_GRANTED) {

                                      request.grant(
                                          new String[] {
                                              PermissionRequest.RESOURCE_AUDIO_CAPTURE
                                          }
                                      );

                                      return;
                                  }

                                  pendingMicrophoneRequest = request;

                                  ActivityCompat.requestPermissions(
                                      MainActivity.this,
                                      new String[] {
                                          Manifest.permission.RECORD_AUDIO
                                      },
                                      MICROPHONE_PERMISSION_REQUEST
                                  );

                                  return;
                              }

                              super.onPermissionRequest(request);
                          }
                      }
                  );

                  webView.loadUrl(LIVE_URL);
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  );

                  if (requestCode == MICROPHONE_PERMISSION_REQUEST) {

                      if (pendingMicrophoneRequest == null) {
                          return;
                      }

                      if (grantResults.length > 0 &&
                          grantResults[0] == PackageManager.PERMISSION_GRANTED) {

                          pendingMicrophoneRequest.grant(
                              new String[] {
                                  PermissionRequest.RESOURCE_AUDIO_CAPTURE
                              }
                          );

                      } else {

                          pendingMicrophoneRequest.deny();
                      }

                      pendingMicrophoneRequest = null;
                  }
              }

              @Override
              public void onDestroy() {

                  if (pendingMicrophoneRequest != null) {
                      try {
                          pendingMicrophoneRequest.deny();
                      } catch (Exception ignored) {
                      }

                      pendingMicrophoneRequest = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Add microphone permission again after sync
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if "android.permission.RECORD_AUDIO" not in text:
              text = text.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          manifest.write_text(text)

          print("Microphone permission confirmed.")
          PY

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PremiumApp-live-sync-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
