name: Build Live Sync Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert --version

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.3.2 @capacitor/cli@8.3.2 @capacitor/android@8.3.2

      - name: Create temporary web files
        run: |
          rm -rf dist
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Premium App Store</title>
          </head>
          <body>
            <p>Loading...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.premium.app",
            "appName": "Premium App Store",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": false,
              "allowNavigation": [
                "sumityadav06.github.io"
              ]
            }
          }
          EOF

      - name: Add Android
        run: |
          rm -rf android
          npx cap add android

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.REQUEST_INSTALL_PACKAGES"
          ]

          for perm in permissions:
              s = re.sub(
                  rf'\s*<uses-permission\s+android:name="{re.escape(perm)}"\s*/>',
                  '',
                  s
              )

          permission_block = "\n".join(
              f'    <uses-permission android:name="{perm}" />'
              for perm in permissions
          )

          s = s.replace(
              "<application",
              permission_block + "\n\n    <application",
              1
          )

          p.write_text(s)
          PY

      - name: Create app icon
        run: |
          set -e

          if [ ! -f "app-icon.png" ]; then
            echo "ERROR: app-icon.png not found!"
            exit 1
          fi

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi"
          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/drawable-nodpi"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"
          mkdir -p "$RES/drawable-nodpi"
          mkdir -p "$RES/mipmap-anydpi-v26"

          convert app-icon.png -resize 48x48 \
            "$RES/mipmap-mdpi/ic_launcher.png"

          convert app-icon.png -resize 72x72 \
            "$RES/mipmap-hdpi/ic_launcher.png"

          convert app-icon.png -resize 96x96 \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          convert app-icon.png -resize 144x144 \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          convert app-icon.png -resize 192x192 \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES/mipmap-mdpi/ic_launcher.png" \
             "$RES/mipmap-mdpi/ic_launcher_round.png"

          cp "$RES/mipmap-hdpi/ic_launcher.png" \
             "$RES/mipmap-hdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xhdpi/ic_launcher.png" \
             "$RES/mipmap-xhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxhdpi/ic_launcher_round.png"

          cp "$RES/mipmap-xxxhdpi/ic_launcher.png" \
             "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          convert -size 432x432 xc:none \
            "$RES/drawable-nodpi/ic_launcher_foreground.png"

          convert app-icon.png \
            -resize 280x280 \
            "$RES/drawable-nodpi/icon_center.png"

          composite \
            -gravity center \
            "$RES/drawable-nodpi/icon_center.png" \
            "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/drawable-nodpi/ic_launcher_foreground.png"

          convert -size 432x432 xc:none \
            "$RES/drawable-nodpi/ic_launcher_background.png"

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

      - name: Configure launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'\s*android:icon="[^"]*"',
              '',
              s,
              count=1
          )

          s = re.sub(
              r'\s*android:roundIcon="[^"]*"',
              '',
              s,
              count=1
          )

          s = s.replace(
              "<application",
              '<application '
              'android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher_round"',
              1
          )

          p.write_text(s)
          PY

      - name: Configure MainActivity
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])

          package_match = re.search(
              r'^\s*package\s+([^;]+);',
              p.read_text(),
              re.MULTILINE
          )

          if not package_match:
              raise RuntimeError("Package declaration not found")

          package_name = package_match.group(1)

          p.write_text(f'''package {package_name};

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{

              private static final int MICROPHONE_PERMISSION_CODE = 1001;
              private static final int STORAGE_PERMISSION_CODE = 1002;

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  requestPermissionsIfNeeded();

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {{
                      webView.setDownloadListener(new DownloadListener() {{
                          @Override
                          public void onDownloadStart(
                                  String url,
                                  String userAgent,
                                  String contentDisposition,
                                  String mimetype,
                                  long contentLength) {{

                              startDownload(
                                  url,
                                  userAgent,
                                  contentDisposition,
                                  mimetype
                              );
                          }}
                      }});
                  }}
              }}

              private void requestPermissionsIfNeeded() {{
                  if (Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {{

                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {{
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.MODIFY_AUDIO_SETTINGS
                          }},
                          MICROPHONE_PERMISSION_CODE
                      );
                  }}

                  if (Build.VERSION.SDK_INT <= Build.VERSION_CODES.P &&
                      checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                          != PackageManager.PERMISSION_GRANTED) {{

                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {{
                              Manifest.permission.WRITE_EXTERNAL_STORAGE
                          }},
                          STORAGE_PERMISSION_CODE
                      );
                  }}
              }}

              private void startDownload(
                      String url,
                      String userAgent,
                      String contentDisposition,
                      String mimetype) {{

                  try {{
                      Uri uri = Uri.parse(url);

                      String fileName = URLUtil.guessFileName(
                          url,
                          contentDisposition,
                          mimetype
                      );

                      if (fileName == null || fileName.trim().isEmpty()) {{
                          fileName = "download";
                      }}

                      fileName = fileName.replaceAll(
                          "[\\\\\\\\/:*?\\\"<>|]",
                          "_"
                      );

                      DownloadManager.Request request =
                          new DownloadManager.Request(uri);

                      request.setTitle(fileName);
                      request.setDescription("Downloading " + fileName);

                      if (mimetype != null &&
                          !mimetype.trim().isEmpty()) {{
                          request.setMimeType(mimetype);
                      }}

                      if (userAgent != null &&
                          !userAgent.trim().isEmpty()) {{
                          request.addRequestHeader(
                              "User-Agent",
                              userAgent
                          );
                      }}

                      String cookie =
                          CookieManager.getInstance().getCookie(url);

                      if (cookie != null &&
                          !cookie.trim().isEmpty()) {{
                          request.addRequestHeader(
                              "Cookie",
                              cookie
                          );
                      }}

                      request.setAllowedOverMetered(true);
                      request.setAllowedOverRoaming(true);

                      request.setNotificationVisibility(
                          DownloadManager.Request
                              .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                      );

                      request.setVisibleInDownloadsUi(true);

                      request.setDestinationInExternalPublicDir(
                          Environment.DIRECTORY_DOWNLOADS,
                          fileName
                      );

                      DownloadManager manager =
                          (DownloadManager)
                              getSystemService(
                                  Context.DOWNLOAD_SERVICE
                              );

                      if (manager != null) {{
                          manager.enqueue(request);
                      }}

                  }} catch (Exception e) {{
                      e.printStackTrace();
                  }}
              }}
          }}
          ''')

          print("Microphone and native download handling configured.")
          PY

      - name: Add legacy storage permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />'

          if permission not in s:
              s = s.replace(
                  "<application",
                  permission + "\n\n    <application",
                  1
              )

          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-App-Store-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
