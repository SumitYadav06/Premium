name: Build Live Sync Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Android App
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "PremiumApp" "com.premium.app" --web-dir dist
          npx cap add android
          
          # लाइव GitHub Pages लिंक सेट करना
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.premium.app",
            "appName": "PremiumApp",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": true
            }
          }
          EOF

          npx cap update android
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
