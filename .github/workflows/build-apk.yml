name: Build Live Sync Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert --version

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.3.2 @capacitor/cli@8.3.2 @capacitor/android@8.3.2

      - name: Create temporary web files
        run: |
          rm -rf dist
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Premium App Store</title>
          </head>
          <body>
            <p>Loading...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.premium.app",
            "appName": "Premium App Store",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": false,
              "allowNavigation": [
                "sumityadav06.github.io"
              ]
            }
          }
          EOF

      - name: Add Android
        run: |
          rm -rf android
          npx cap add android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.REQUEST_INSTALL_PACKAGES"
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      "<application",
                      f'    <uses-permission android:name="{perm}" />\n    <application',
                      1
                  )

          p.write_text(s)
          print("Permissions added.")
          PY

      - name: Set app name and icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert app-icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert app-icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert app-icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert app-icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert app-icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-App-Store-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
