name: Build Live Sync Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert --version

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.3.2 @capacitor/cli@8.3.2 @capacitor/android@8.3.2 @capacitor/filesystem@8.1.5 @capawesome-team/capacitor-file-opener@8.1.1

      # Local Unity Ads plugin (plugins/unity-ads, @premium/unity-ads).
      # It is a file: dependency in package.json, so plain `npm install`
      # links it into node_modules; this step makes the link explicit
      # and fails loudly if the plugin folder is missing.
      - name: Install Unity Ads plugin (local)
        run: |
          if [ ! -f "plugins/unity-ads/package.json" ]; then
            echo "ERROR: plugins/unity-ads not found in repo!"
            exit 1
          fi
          npm install ./plugins/unity-ads
          ls node_modules/@premium/unity-ads/android/src/main/java/com/premium/unityads/UnityAdsPlugin.java
      - name: Create temporary web files
        run: |
          rm -rf dist
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Premium App Store</title>
          </head>
          <body>
            <p>Loading...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.premium.app",
            "appName": "Premium App Store",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": false,
              "allowNavigation": [
                "sumityadav06.github.io"
              ]
            }
          }
          EOF

      - name: Add Android
        run: |
          rm -rf android
          npx cap add android

      # The Unity Ads plugin declares minSdkVersion 26, but the
      # Capacitor 8 generated project resolves to 24 — without this
      # the manifest merger fails the build ("uses-sdk:minSdkVersion 24
      # cannot be smaller than version 26"). Same fix as the games
      # (which had to raise 22 -> 26 on Capacitor 6). Android 8.0+
      # (API 26) covers ~all active phones.
      # compileSdk 36 is required too: the plugin's appcompat 1.7.0
      # resolves (via capacitor-android) to androidx.activity 1.11.0
      # and androidx.core 1.17.0, whose AAR metadata declares
      # minCompileSdk 36 — run #205 failed checkReleaseAarMetadata
      # because a module compiled against android-35. The Capacitor
      # 8.3.2 template already ships compileSdk/targetSdk 36 for the
      # app, so the variables.gradle lines below are a fail-loudly
      # assert there; the REAL change is the plugin module, whose own
      # build.gradle hardcodes compileSdk 35 / targetSdkVersion 35.
      # Both patches apply to the checkout copy at build time only;
      # no repo file besides this workflow is modified. The GitHub
      # ubuntu-latest runner image already preinstalls platform
      # android-36 (rev 2) and build-tools 36.0.0, so no sdkmanager
      # install step is needed.
      - name: Raise minSdk to 26 and compileSdk to 36 (Unity Ads plugin needs 26/36)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          def patch(fname, subs, required):
              p = pathlib.Path(fname)
              if not p.exists():
                  print(f'ERROR: {fname} not found')
                  sys.exit(1)
              t = p.read_text()
              for pattern, repl, label in subs:
                  t, n = re.subn(pattern, repl, t)
                  if n == 0 and label in required:
                      print(f'ERROR: {label} line not found in {fname}')
                      sys.exit(1)
                  if n:
                      print(f'  {fname}: {label} set ({n} replacement(s))')
              p.write_text(t)

          # 1. Generated Android project: minSdk 24 -> 26, and assert
          #    compileSdk/targetSdk at 36.
          patch('android/variables.gradle', [
              (r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 26', 'minSdkVersion'),
              (r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', 'compileSdkVersion'),
              (r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', 'targetSdkVersion'),
          ], required={'minSdkVersion', 'compileSdkVersion', 'targetSdkVersion'})
          # app/build.gradle reads the SDK values from variables.gradle;
          # its minSdk lines (if any) are raised too, but none are required.
          patch('android/app/build.gradle', [
              (r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 26', 'minSdkVersion'),
              (r'minSdkVersion\s+\d+', 'minSdkVersion 26', 'minSdkVersion'),
              (r'\bminSdk\s*=\s*\d+', 'minSdk = 26', 'minSdk'),
              (r'\bminSdk\s+\d+', 'minSdk 26', 'minSdk'),
          ], required=set())
          # 2. Unity Ads plugin module (build-time patch only — the repo
          #    file plugins/unity-ads/android/build.gradle is untouched):
          #    compileSdk 35 -> 36, targetSdkVersion 35 -> 36.
          patch('plugins/unity-ads/android/build.gradle', [
              (r'compileSdk\s+\d+', 'compileSdk 36', 'compileSdk'),
              (r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', 'targetSdkVersion'),
          ], required={'compileSdk', 'targetSdkVersion'})
          print('SDK versions raised: minSdk 26, compileSdk/targetSdk 36')
          PY

      - name: Ask install permission at first app open
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path("android/app/src/main/java").rglob("MainActivity.kt"))
          if not candidates:
              print("MainActivity.kt nahi mili - skip")
              raise SystemExit(0)
          p = candidates[0]
          s = p.read_text()

          if "AJ_PERM_CHECK" in s:
              print("Pehle se laga hai - skip")
              raise SystemExit(0)

          imports = (
              "import android.content.Intent\n"
              "import android.net.Uri\n"
              "import android.provider.Settings\n"
          )
          lines = s.split("\n")
          for i, ln in enumerate(lines):
              if ln.startswith("package "):
                  lines.insert(i + 1, imports)
                  break
          s = "\n".join(lines)
          if "import android.os.Bundle" not in s:
              s = s.replace("import android.provider.Settings", "import android.os.Bundle\nimport android.provider.Settings")

          helper = '''
              // AJ_PERM_CHECK: pehli baar app khulte hi install permission (sirf ek baar)
              private fun ajAskInstallPermissionOnce() {
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          if (!packageManager.canRequestPackageInstalls()) {
                              val prefs = getSharedPreferences("aj_prefs", MODE_PRIVATE)
                              if (!prefs.getBoolean("aj_perm_asked", false)) {
                                  val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES).apply {
                                      data = Uri.parse("package:" + packageName)
                                  }
                                  startActivity(intent)
                                  prefs.edit().putBoolean("aj_perm_asked", true).apply()
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // fail ho to chup - app crash nahi hona chahiye
                  }
              }
          '''

          if "super.onCreate(savedInstanceState)" in s:
              s = s.replace(
                  "super.onCreate(savedInstanceState)",
                  "super.onCreate(savedInstanceState)\n        ajAskInstallPermissionOnce()",
                  1,
              )
              idx = s.rstrip().rfind("}")
              s = s[:idx] + helper + "}\n"
          else:
              idx = s.rstrip().rfind("}")
              oncreate = '''
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ajAskInstallPermissionOnce()
              }
          '''
              s = s[:idx] + oncreate + helper + "}\n"

          p.write_text(s)
          print("MainActivity patch ho gaya:", p)
          PY

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.REQUEST_INSTALL_PACKAGES",
              # Android 13+: DownloadManager ki download notification (shade me %) dikhane ke liye
              "android.permission.POST_NOTIFICATIONS"
          ]

          for perm in permissions:
              s = re.sub(
                  rf'\s*<uses-permission\s+android:name="{re.escape(perm)}"\s*/>',
                  '',
                  s
              )

          permission_block = "\n".join(
              f'    <uses-permission android:name="{perm}" />'
              for perm in permissions
          )

          s = s.replace(
              "<application",
              permission_block + "\n\n    <application",
              1
          )

          p.write_text(s)

          print("Permissions configured:")
          for perm in permissions:
              print(" -", perm)
          PY

      # ============================================================
      # HIGH QUALITY ADAPTIVE APP ICON
      # ============================================================
      - name: Create high quality adaptive launcher icon
        run: |
          set -e

          if [ ! -f "app-icon.png" ]; then
            echo "ERROR: app-icon.png not found!"
            exit 1
          fi

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/drawable-nodpi"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"
          mkdir -p "$RES/drawable-nodpi"
          mkdir -p "$RES/mipmap-anydpi-v26"

          # --------------------------------------------------
          # LAUNCHER ICON — EXACTLY LIKE THE OLD 4.66 MB APK
          # User (2026-11-26): "old APK jaisa icon chahiye, ekdam
          # same". Measured from old-app-debug.apk itself: ADAPTIVE
          # icon, foreground art bbox 63% of the 432 canvas (272px),
          # background = Capacitor default teal #26A69A with a faint
          # white grid. Legacy icons = the art alone, full size
          # (bbox ~97%).
          # The 65%-legacy-only attempt (run #191) looked WRONG on
          # the phone: Samsung puts a legacy icon inside a white
          # frame, so the logo looked tiny with a blue square inside
          # it. The adaptive icon fills the launcher mask, so there
          # is no white frame and no separate blue square — just the
          # logo, like the old APK.
          # Foreground placement: art bbox is 96.9% of app-icon.png,
          # so 281px placement gives a 272px bbox = 63% of 432.
          # --------------------------------------------------
          # Background — teal #26A69A + faint white grid (old vector)
          convert -size 432x432 xc:"#26A69A" \
            -stroke "rgba(255,255,255,0.2)" -strokewidth 1 \
            -draw "line 36,0 36,432 line 76,0 76,432 line 116,0 116,432 line 156,0 156,432 line 196,0 196,432 line 236,0 236,432 line 276,0 276,432 line 316,0 316,432 line 356,0 356,432 line 396,0 396,432 line 0,36 432,36 line 0,76 432,76 line 0,116 432,116 line 0,156 432,156 line 0,196 432,196 line 0,236 432,236 line 0,276 432,276 line 0,316 432,316 line 0,356 432,356 line 0,396 432,396" \
            "$RES/drawable-nodpi/ic_launcher_background.png"

          # Legacy icons — the art alone, full size (old APK style)
          for spec in "48 mdpi" "72 hdpi" "96 xhdpi" "144 xxhdpi" "192 xxxhdpi"; do
            set -- $spec
            convert app-icon.png -filter Lanczos -resize "$1x$1" \
              "$RES/mipmap-$2/ic_launcher.png"
            cp "$RES/mipmap-$2/ic_launcher.png" "$RES/mipmap-$2/ic_launcher_round.png"
          done

          # --------------------------------------------------
          # ADAPTIVE ICON — foreground is the art at 281px
          # (272px bbox = 63% of 432, exactly like the old APK)
          # centred on a transparent canvas.
          # BLACK-AND-WHITE BUG (found 2026-11-26): the old way
          # (`convert xc:none` canvas + `composite`) wrote the
          # foreground as a GRAYSCALE PNG on the GitHub runner —
          # runs #186/#187/#191/#192 all shipped a gray foreground,
          # which is why the icon showed black and white on the
          # phone (MT Manager shows the colourful legacy icon, the
          # launcher shows the gray adaptive foreground). It was
          # NEVER the phone's themed-icons setting. This single
          # `convert -extent` + `-type TrueColorAlpha` keeps the
          # art's own colours (verified locally: sRGB TrueColorAlpha,
          # colourful pixels present).
          # --------------------------------------------------
          convert app-icon.png -filter Lanczos -resize 281x281 \
            -background none -gravity center -extent 432x432 \
            -type TrueColorAlpha \
            "$RES/drawable-nodpi/ic_launcher_foreground.png"

          # Adaptive icon XMLs (restored — the legacy-only attempt
          # made the icon tiny inside a white frame on Samsung)
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # Delete leftover template icon files in mipmap folders
          # (default white Capacitor logo from `cap add android`).
          # These are unused — but they ship inside the APK if left behind.
          find "$RES" -path "*mipmap*/ic_launcher_foreground.png" -delete
          find "$RES" -path "*mipmap*/ic_launcher_background.png" -delete

          # ICON COLOUR CHECK — the foreground must be a colour PNG.
          # If it ever comes out grayscale again, the icon shows black
          # and white on the phone, so fail the build loudly here.
          FG_TYPE=$(identify -format "%[type]" "$RES/drawable-nodpi/ic_launcher_foreground.png")
          echo "Launcher foreground PNG type: $FG_TYPE"
          case "$FG_TYPE" in
            *TrueColor*|*Palette*) ;;
            *) echo "ERROR: launcher foreground is $FG_TYPE, not colour — icon would be black and white"; exit 1 ;;
          esac

          echo "Old-style adaptive icon created successfully."

      # ============================================================
      # MICROPHONE - KEEP WORKING CONFIGURATION
      # ============================================================

      - name: Add native microphone startup permission
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])

          package_match = re.search(
              r'^\s*package\s+([^;]+);',
              p.read_text(),
              re.MULTILINE
          )

          if not package_match:
              raise RuntimeError("Package declaration not found")

          package_name = package_match.group(1)

          code = f'''package {package_name};

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{

              private static final int MICROPHONE_PERMISSION_CODE = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  // BackgroundDownload plugin — bridge banne (super.onCreate)
                  // SE PEHLE register karna zaroori hai, warna WebView ko dikhta nahi.
                  registerPlugin(BackgroundDownloadPlugin.class);
                  super.onCreate(savedInstanceState);

                  // Background download ki notification (Android 13+) — sirf ek baar poocho
                  ajAskNotificationPermissionOnce();

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {{

                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {{
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.MODIFY_AUDIO_SETTINGS
                          }},
                          MICROPHONE_PERMISSION_CODE
                      );
                  }}

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {{
                      webView.setDownloadListener(new DownloadListener() {{

                          @Override
                          public void onDownloadStart(
                                  String url,
                                  String userAgent,
                                  String contentDisposition,
                                  String mimetype,
                                  long contentLength) {{

                              try {{
                                  Uri uri = Uri.parse(url);

                                  String fileName = URLUtil.guessFileName(
                                      url,
                                      contentDisposition,
                                      mimetype
                                  );

                                  DownloadManager.Request request =
                                      new DownloadManager.Request(uri);

                                  request.setTitle(fileName);
                                  request.setDescription(
                                      "Downloading " + fileName
                                  );

                                  request.setAllowedOverMetered(true);
                                  request.setAllowedOverRoaming(true);

                                  // VISIBILITY_VISIBLE = download chalte hue shade me live %
                                  // dikhe (Play Store jaisa), pura hote hi complete notification.
                                  request.setNotificationVisibility(
                                      DownloadManager.Request
                                          .VISIBILITY_VISIBLE
                                  );

                                  request.setVisibleInDownloadsUi(true);

                                  request.setDestinationInExternalPublicDir(
                                      Environment.DIRECTORY_DOWNLOADS,
                                      fileName
                                  );

                                  if (mimetype != null &&
                                      !mimetype.isEmpty()) {{
                                      request.setMimeType(mimetype);
                                  }}

                                  if (userAgent != null &&
                                      !userAgent.isEmpty()) {{
                                      request.addRequestHeader(
                                          "User-Agent",
                                          userAgent
                                      );
                                  }}

                                  String cookie =
                                      CookieManager
                                          .getInstance()
                                          .getCookie(url);

                                  if (cookie != null &&
                                      !cookie.isEmpty()) {{
                                      request.addRequestHeader(
                                          "Cookie",
                                          cookie
                                      );
                                  }}

                                  DownloadManager manager =
                                      (DownloadManager)
                                          getSystemService(
                                              Context.DOWNLOAD_SERVICE
                                          );

                                  if (manager != null) {{
                                      manager.enqueue(request);
                                  }}

                              }} catch (Exception e) {{
                                  e.printStackTrace();
                              }}
                          }}
                      }});
                  }}
              }}

              // AJ_NOTIF_PERM: Android 13+ par DownloadManager ki notification
              // (download % shade me) dikhane ke liye ek baar permission maango.
              // User mana kare to bhi download chalta hai — sirf notification nahi dikhega.
              private void ajAskNotificationPermissionOnce() {{
                  try {{
                      if (android.os.Build.VERSION.SDK_INT >= 33) {{
                          if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)
                                  != PackageManager.PERMISSION_GRANTED) {{
                              android.content.SharedPreferences prefs =
                                      getSharedPreferences("aj_prefs", MODE_PRIVATE);
                              if (!prefs.getBoolean("aj_notif_asked", false)) {{
                                  requestPermissions(
                                          new String[]{{ android.Manifest.permission.POST_NOTIFICATIONS }},
                                          1002);
                                  prefs.edit().putBoolean("aj_notif_asked", true).apply();
                              }}
                          }}
                      }}
                  }} catch (Exception e) {{
                      // fail ho to chup - app crash nahi hona chahiye
                  }}
              }}
          }}
          '''

          p.write_text(code)
          print("Microphone + native download configured.")
          PY
          

      # Background download (DownloadManager) plugin — native/BackgroundDownloadPlugin.java
      # repo me hai; android/ CI me generate hota hai, isliye yahan copy hota hai.
      # MainActivity me registerPlugin() pehle wale step ke template me hai.
      - name: Add background download plugin
        run: |
          set -e
          SRC="native/BackgroundDownloadPlugin.java"
          if [ ! -f "$SRC" ]; then
            echo "ERROR: $SRC not found in repo!"
            exit 1
          fi
          MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi
          DEST_DIR=$(dirname "$MAIN")
          cp "$SRC" "$DEST_DIR/BackgroundDownloadPlugin.java"
          PKG=$(grep -m1 '^package ' "$MAIN" | sed 's/package //; s/;//; s/ *//g')
          sed -i "s/^package .*;/package $PKG;/" "$DEST_DIR/BackgroundDownloadPlugin.java"
          grep -q "registerPlugin(BackgroundDownloadPlugin.class)" "$MAIN" || {
            echo "ERROR: MainActivity.java does not register BackgroundDownloadPlugin!"
            exit 1
          }
          echo "BackgroundDownloadPlugin installed in $DEST_DIR (package $PKG)."

      - name: Sync Capacitor
        run: |
          npx cap sync android

      # Unity Ads needs NO manifest meta-data: the Game ID is passed to
      # UnityAds.initialize() at runtime from src/ads.ts (the live site
      # the APK loads). This step FAILS LOUDLY if the Game ID is still
      # the '[FILL IN]' placeholder — no APK may ever be built with a
      # placeholder or test Game ID. Replace UNITY_GAME_ID in src/ads.ts
      # with the real Unity Game ID first, then re-run.
      - name: Fail loudly if Unity Game ID is still [FILL IN]
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          src = Path('src/ads.ts').read_text()
          fails = []
          # Check ONLY the UNITY_GAME_ID constant's value — the literal
          # '[FILL IN]' also appears in comments and in the runtime
          # guard in src/ads.ts, so a whole-file search would false-fail
          # even after the real ID is pasted in.
          m = re.search(r"UNITY_GAME_ID\s*=\s*'([^']*)'", src)
          if not m:
              fails.append('UNITY_GAME_ID constant not found in src/ads.ts')
          elif '[FILL IN]' in m.group(1):
              fails.append("UNITY_GAME_ID in src/ads.ts is still '[FILL IN]' — paste the real Unity Game ID first")
          if m and m.group(1) == '3940256099942544':
              fails.append('test Game ID 3940256099942544 in src/ads.ts — never ship a test ID')
          if 'ca-app-pub' in src:
              fails.append('AdMob ID still in src/ads.ts')
          if fails:
              print('UNITY GAME ID CHECK FAILED:')
              for f in fails:
                  print(' -', f)
              sys.exit(1)
          print('Unity Game ID present in src/ads.ts (real ID, no placeholder, no test ID)')
          PY

      # Unity Ads wiring check — fail loudly if the plugin did not
      # register with Capacitor, or an old ad-network ID is still in
      # the shipped code. (The APK loads the live site, so the Game ID
      # and placements are checked in src/ads.ts, not in dist/.)
      - name: Verify Unity Ads wiring
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          fails = []
          plug = pathlib.Path('android/app/src/main/assets/capacitor.plugins.json')
          if not plug.exists():
              fails.append('capacitor.plugins.json missing (did cap sync run?)')
          elif 'UnityAds' not in plug.read_text():
              fails.append('UnityAds plugin not registered in capacitor.plugins.json')
          src = pathlib.Path('src/ads.ts').read_text()
          for bad in ('ca-app-pub', '3940256099942544', 'AdMob', 'admob'):
              if bad in src:
                  fails.append('forbidden string in src/ads.ts: ' + bad)
          for good in ('BP_Rewarded_Android', 'BP_Interstitial_Android'):
              if good not in src:
                  fails.append('missing Unity placement in src/ads.ts: ' + good)
          if 'showBanner' in src or 'BP_Banner_Android' in src:
              fails.append('banner reference in src/ads.ts — Premium is video ads only')
          if fails:
              print('UNITY ADS CHECK FAILED:')
              for f in fails:
                  print(' -', f)
              sys.exit(1)
          print('Unity Ads wiring OK: plugin registered, 2 video placements present, no old-network IDs')
          PY

      # ============================================================
      # VERIFY EVERYTHING
      # ============================================================

      - name: Verify Android configuration
        run: |
          echo "================================"
          echo "ANDROID PERMISSIONS"
          echo "================================"

          grep -n "RECORD_AUDIO" \
            android/app/src/main/AndroidManifest.xml || true

          grep -n "MODIFY_AUDIO_SETTINGS" \
            android/app/src/main/AndroidManifest.xml || true

          echo "================================"
          echo "LAUNCHER ICON"
          echo "================================"

          grep -n "android:icon" \
            android/app/src/main/AndroidManifest.xml || true

          grep -n "android:roundIcon" \
            android/app/src/main/AndroidManifest.xml || true

          echo "================================"
          echo "ICON FILES"
          echo "================================"

          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_background.png" \
              -o -name "ic_launcher_foreground.png" \
            \) \
            -print

          echo "================================"
          echo "BACKGROUND DOWNLOAD PLUGIN"
          echo "================================"

          find android/app/src/main/java \
            -name "BackgroundDownloadPlugin.java" -print || true

          grep -rn "registerPlugin(BackgroundDownloadPlugin.class)" \
            android/app/src/main/java || true

          grep -n "POST_NOTIFICATIONS" \
            android/app/src/main/AndroidManifest.xml || true

      # ============================================================
      # RELEASE SIGNING — one permanent keystore for every build
      # ============================================================
      # Same keystore -> same certificate -> Android accepts the new APK
      # as an update over the old one (no uninstall needed).
      # The keystore itself lives ONLY in GitHub secrets; no secret
      # value appears anywhere in this file.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub secret KEYSTORE_BASE64 is not set for this repo."
            echo "Add secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD"
            echo "in repo Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: one of KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD is not set."
            exit 1
          fi
          echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64} chars (expect 3568)"
          for i in 0 1 2 3; do off=$((i*892)); part="${KEYSTORE_BASE64:$off:892}"; echo "chunk$((i+1)) len: ${#part} md5: $(printf '%s' "$part" | md5sum | cut -d' ' -f1)"; done
          echo "joined sha256: $(printf '%s' "$KEYSTORE_BASE64" | sha256sum | cut -d' ' -f1)"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then echo "ERROR: decoded keystore is empty"; exit 1; fi
          ls -l android/app/release.keystore
          python3 - << 'EOF'
          import os, re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          run_number = os.environ['GITHUB_RUN_NUMBER']
          # 1. signingConfigs.release right after "android {"
          if 'signingConfigs' not in s:
              block = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  '            storeFile file("release.keystore")\n'
                  '            storePassword System.getenv("KEYSTORE_PASSWORD")\n'
                  '            keyAlias System.getenv("KEY_ALIAS")\n'
                  '            keyPassword System.getenv("KEY_PASSWORD")\n'
                  '        }\n'
                  '    }\n'
              )
              s, n = re.subn(r'(?m)^([ \t]*android[ \t]*\{[ \t]*)$', r'\1\n' + block, s, count=1)
              assert n == 1, 'android { block not found'
          # 2. versionCode = run number (must always increase for updates)
          s, n = re.subn(r'versionCode\s+\d+', 'versionCode ' + run_number, s, count=1)
          assert n == 1, 'versionCode not found'
          # 3. versionName stays 1.0
          s, n = re.subn(r'versionName\s+"[^"]*"', 'versionName "1.0"', s, count=1)
          assert n == 1, 'versionName not found'
          # 4. wire the release build type to the signing config
          if 'signingConfig signingConfigs.release' not in s:
              m = re.search(r'(?m)^(.*buildTypes[ \t]*\{[ \t]*)$', s)
              assert m, 'buildTypes block not found'
              m2 = re.search(r'(?m)^([ \t]*)release[ \t]*\{[ \t]*$', s[m.end():])
              assert m2, 'release block not found'
              indent = m2.group(1) + '    '
              pos = m.end() + m2.end()
              s = s[:pos] + '\n' + indent + 'signingConfig signingConfigs.release' + s[pos:]
          p.write_text(s)
          print('release signing configured, versionCode =', run_number)
          EOF

      # ============================================================
      # BUILD APK
      # ============================================================

      # Gradle dependency cache — the AGP 8.13.0 tree (~50 artifacts)
      # is downloaded from Google Maven / Maven Central on every run.
      # Runs #198-#204 (2026-11-27) all failed resolving it while the
      # identical template resolved fine for #197 37 seconds earlier
      # and every artifact exists on the repos (verified) — a transient
      # runner-side network/rate-limit event, not a bad AGP version.
      # Once any run resolves the tree, later runs reuse the cached
      # copy instead of fetching it again.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-cap8-${{ hashFiles('package.json', 'package-lock.json', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            gradle-${{ runner.os }}-cap8-

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          # Retry the Gradle build: dependency resolution (AGP 8.13.0
          # classpath) needs Google Maven / Maven Central, and a short
          # runner-side network or rate-limit blip must not kill the
          # whole run (that is what killed #198-#204). One invocation
          # per attempt (clean + assembleRelease together) so each
          # attempt resolves the classpath exactly once.
          for attempt in 1 2 3; do
            echo "=== Gradle build attempt $attempt/3 ==="
            if ./gradlew clean assembleRelease; then
              echo "Gradle build succeeded on attempt $attempt"
              exit 0
            fi
            echo "Gradle build attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 90s..."
              sleep 90
            fi
          done
          echo "ERROR: Gradle build failed after 3 attempts"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-App-Store-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Har build ka APK ek hi fixed link par — purane users yahi se update honge
      # Fixed link: https://github.com/SumitYadav06/Premium/releases/download/store-latest/Apna.Jugaad.apk
      - name: Rename APK to Apna.Jugaad.apk
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Apna.Jugaad.apk

      - name: Publish APK on fixed download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-latest
          name: Apna Jugaad Store - Latest APK
          body: |
            Hamesha ka sabse naya store APK. Ye link kabhi nahi badalta —
            website aur purana app isi link se update hota hai.
          files: android/app/build/outputs/apk/release/Apna.Jugaad.apk
