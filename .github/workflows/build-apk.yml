name: Build Live Sync Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert --version

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@8.3.2 @capacitor/cli@8.3.2 @capacitor/android@8.3.2 @capacitor/filesystem@8.1.5 @capawesome-team/capacitor-file-opener@8.1.1 @capacitor-community/admob@8.4.2
      - name: Create temporary web files
        run: |
          rm -rf dist
          mkdir -p dist

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Premium App Store</title>
          </head>
          <body>
            <p>Loading...</p>
          </body>
          </html>
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.premium.app",
            "appName": "Premium App Store",
            "webDir": "dist",
            "server": {
              "url": "https://sumityadav06.github.io/Premium/",
              "cleartext": false,
              "allowNavigation": [
                "sumityadav06.github.io"
              ]
            }
          }
          EOF

      - name: Add Android
        run: |
          rm -rf android
          npx cap add android

      - name: Ask install permission at first app open
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = list(Path("android/app/src/main/java").rglob("MainActivity.kt"))
          if not candidates:
              print("MainActivity.kt nahi mili - skip")
              raise SystemExit(0)
          p = candidates[0]
          s = p.read_text()

          if "AJ_PERM_CHECK" in s:
              print("Pehle se laga hai - skip")
              raise SystemExit(0)

          imports = (
              "import android.content.Intent\n"
              "import android.net.Uri\n"
              "import android.provider.Settings\n"
          )
          lines = s.split("\n")
          for i, ln in enumerate(lines):
              if ln.startswith("package "):
                  lines.insert(i + 1, imports)
                  break
          s = "\n".join(lines)
          if "import android.os.Bundle" not in s:
              s = s.replace("import android.provider.Settings", "import android.os.Bundle\nimport android.provider.Settings")

          helper = '''
              // AJ_PERM_CHECK: pehli baar app khulte hi install permission (sirf ek baar)
              private fun ajAskInstallPermissionOnce() {
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                          if (!packageManager.canRequestPackageInstalls()) {
                              val prefs = getSharedPreferences("aj_prefs", MODE_PRIVATE)
                              if (!prefs.getBoolean("aj_perm_asked", false)) {
                                  val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES).apply {
                                      data = Uri.parse("package:" + packageName)
                                  }
                                  startActivity(intent)
                                  prefs.edit().putBoolean("aj_perm_asked", true).apply()
                              }
                          }
                      }
                  } catch (e: Exception) {
                      // fail ho to chup - app crash nahi hona chahiye
                  }
              }
          '''

          if "super.onCreate(savedInstanceState)" in s:
              s = s.replace(
                  "super.onCreate(savedInstanceState)",
                  "super.onCreate(savedInstanceState)\n        ajAskInstallPermissionOnce()",
                  1,
              )
              idx = s.rstrip().rfind("}")
              s = s[:idx] + helper + "}\n"
          else:
              idx = s.rstrip().rfind("}")
              oncreate = '''
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  ajAskInstallPermissionOnce()
              }
          '''
              s = s[:idx] + oncreate + helper + "}\n"

          p.write_text(s)
          print("MainActivity patch ho gaya:", p)
          PY

      - name: Configure Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.REQUEST_INSTALL_PACKAGES"
          ]

          for perm in permissions:
              s = re.sub(
                  rf'\s*<uses-permission\s+android:name="{re.escape(perm)}"\s*/>',
                  '',
                  s
              )

          permission_block = "\n".join(
              f'    <uses-permission android:name="{perm}" />'
              for perm in permissions
          )

          s = s.replace(
              "<application",
              permission_block + "\n\n    <application",
              1
          )

          p.write_text(s)

          print("Permissions configured:")
          for perm in permissions:
              print(" -", perm)
          PY

      # ============================================================
      # HIGH QUALITY ADAPTIVE APP ICON
      # ============================================================
      - name: Create high quality adaptive launcher icon
        run: |
          set -e

          if [ ! -f "app-icon.png" ]; then
            echo "ERROR: app-icon.png not found!"
            exit 1
          fi

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/drawable-nodpi"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"
          mkdir -p "$RES/drawable-nodpi"
          mkdir -p "$RES/mipmap-anydpi-v26"

          # --------------------------------------------------
          # LAUNCHER ICON — USER'S LOGO, ZOOMED OUT TO 85%
          # User (2026-11-25): full-size 100% was TOO zoomed, "zoom
          # out karo". 85% keeps the logo big while the whole logo
          # (incl. corner mini-icons) stays visible under circle and
          # squircle masks. Background is the art's own edge colour
          # (#0E347F, sampled from app-icon.png) so the padding blends
          # seamlessly with the art's dark background.
          # --------------------------------------------------
          convert -size 432x432 xc:"#0E347F" \
            "$RES/drawable-nodpi/ic_launcher_background.png"

          # Legacy icons — art at 85% centred on the edge-colour
          # background (so they match the launcher icon everywhere)
          for spec in "48 41 mdpi" "72 61 hdpi" "96 82 xhdpi" "144 122 xxhdpi" "192 163 xxxhdpi"; do
            set -- $spec
            convert -size "$1x$1" xc:"#0E347F" \
              \( app-icon.png -filter Lanczos -resize "$2x$2" \) \
              -gravity center -composite \
              "$RES/mipmap-$3/ic_launcher.png"
            cp "$RES/mipmap-$3/ic_launcher.png" "$RES/mipmap-$3/ic_launcher_round.png"
          done

          # --------------------------------------------------
          # ADAPTIVE ICON — foreground is the art at 85% (368x368)
          # centred on a transparent canvas; background above shows
          # through the padding.
          # --------------------------------------------------
          convert -size 432x432 xc:none \
            "$RES/drawable-nodpi/ic_launcher_foreground.png"

          convert app-icon.png -filter Lanczos -resize 368x368 \
            "$RES/drawable-nodpi/icon_center.png"

          composite \
            -gravity center \
            "$RES/drawable-nodpi/icon_center.png" \
            "$RES/drawable-nodpi/ic_launcher_foreground.png" \
            "$RES/drawable-nodpi/ic_launcher_foreground.png"

          rm -f "$RES/drawable-nodpi/icon_center.png"

          # Adaptive icon
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          echo "Safe-area adaptive icon created successfully."

      # ============================================================
      # MICROPHONE - KEEP WORKING CONFIGURATION
      # ============================================================

      - name: Add native microphone startup permission
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])

          package_match = re.search(
              r'^\s*package\s+([^;]+);',
              p.read_text(),
              re.MULTILINE
          )

          if not package_match:
              raise RuntimeError("Package declaration not found")

          package_name = package_match.group(1)

          code = f'''package {package_name};

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.URLUtil;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{

              private static final int MICROPHONE_PERMISSION_CODE = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {{

                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {{
                              Manifest.permission.RECORD_AUDIO,
                              Manifest.permission.MODIFY_AUDIO_SETTINGS
                          }},
                          MICROPHONE_PERMISSION_CODE
                      );
                  }}

                  WebView webView = getBridge().getWebView();

                  if (webView != null) {{
                      webView.setDownloadListener(new DownloadListener() {{

                          @Override
                          public void onDownloadStart(
                                  String url,
                                  String userAgent,
                                  String contentDisposition,
                                  String mimetype,
                                  long contentLength) {{

                              try {{
                                  Uri uri = Uri.parse(url);

                                  String fileName = URLUtil.guessFileName(
                                      url,
                                      contentDisposition,
                                      mimetype
                                  );

                                  DownloadManager.Request request =
                                      new DownloadManager.Request(uri);

                                  request.setTitle(fileName);
                                  request.setDescription(
                                      "Downloading " + fileName
                                  );

                                  request.setAllowedOverMetered(true);
                                  request.setAllowedOverRoaming(true);

                                  request.setNotificationVisibility(
                                      DownloadManager.Request
                                          .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                                  );

                                  request.setVisibleInDownloadsUi(true);

                                  request.setDestinationInExternalPublicDir(
                                      Environment.DIRECTORY_DOWNLOADS,
                                      fileName
                                  );

                                  if (mimetype != null &&
                                      !mimetype.isEmpty()) {{
                                      request.setMimeType(mimetype);
                                  }}

                                  if (userAgent != null &&
                                      !userAgent.isEmpty()) {{
                                      request.addRequestHeader(
                                          "User-Agent",
                                          userAgent
                                      );
                                  }}

                                  String cookie =
                                      CookieManager
                                          .getInstance()
                                          .getCookie(url);

                                  if (cookie != null &&
                                      !cookie.isEmpty()) {{
                                      request.addRequestHeader(
                                          "Cookie",
                                          cookie
                                      );
                                  }}

                                  DownloadManager manager =
                                      (DownloadManager)
                                          getSystemService(
                                              Context.DOWNLOAD_SERVICE
                                          );

                                  if (manager != null) {{
                                      manager.enqueue(request);
                                  }}

                              }} catch (Exception e) {{
                                  e.printStackTrace();
                              }}
                          }}
                      }});
                  }}
              }}
          }}
          '''

          p.write_text(code)
          print("Microphone + native download configured.")
          PY
          

      - name: Sync Capacitor
        run: |
          npx cap sync android

      # AdMob SDK bina is meta-data ke initialise hi nahi hota.
      # App ID public-safe hai (sirf app ki pehchan; paise ya account
      # tak isse koi nahi pahunch sakta). Step idempotent hai.
      - name: Configure AdMob App ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app_id = 'ca-app-pub-2948876721824340~6169328571'
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace('</application>',
                  '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" '
                  f'android:value="{app_id}" />\n    </application>')
              manifest.write_text(s)
              print('AdMob App ID meta-data added to AndroidManifest.xml')
          else:
              print('AdMob App ID already present - skip')
          strings = Path('android/app/src/main/res/values/strings.xml')
          if strings.exists():
              t = strings.read_text()
              if 'admob_app_id' not in t:
                  t = t.replace('</resources>',
                      f'    <string name="admob_app_id">{app_id}</string>\n</resources>')
                  strings.write_text(t)
                  print('admob_app_id added to strings.xml')
          PY

      # ============================================================
      # VERIFY EVERYTHING
      # ============================================================

      - name: Verify Android configuration
        run: |
          echo "================================"
          echo "ANDROID PERMISSIONS"
          echo "================================"

          grep -n "RECORD_AUDIO" \
            android/app/src/main/AndroidManifest.xml || true

          grep -n "MODIFY_AUDIO_SETTINGS" \
            android/app/src/main/AndroidManifest.xml || true

          echo "================================"
          echo "LAUNCHER ICON"
          echo "================================"

          grep -n "android:icon" \
            android/app/src/main/AndroidManifest.xml || true

          grep -n "android:roundIcon" \
            android/app/src/main/AndroidManifest.xml || true

          echo "================================"
          echo "ICON FILES"
          echo "================================"

          find android/app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.png" \
              -o -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_background.png" \
              -o -name "ic_launcher_foreground.png" \
            \) \
            -print

      # ============================================================
      # RELEASE SIGNING — one permanent keystore for every build
      # ============================================================
      # Same keystore -> same certificate -> Android accepts the new APK
      # as an update over the old one (no uninstall needed).
      # The keystore itself lives ONLY in GitHub secrets; no secret
      # value appears anywhere in this file.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub secret KEYSTORE_BASE64 is not set for this repo."
            echo "Add secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD"
            echo "in repo Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: one of KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD is not set."
            exit 1
          fi
          echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64} chars (expect 3568)"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then echo "ERROR: decoded keystore is empty"; exit 1; fi
          ls -l android/app/release.keystore
          python3 - << 'EOF'
          import os, re, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          run_number = os.environ['GITHUB_RUN_NUMBER']
          # 1. signingConfigs.release right after "android {"
          if 'signingConfigs' not in s:
              block = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  '            storeFile file("release.keystore")\n'
                  '            storePassword System.getenv("KEYSTORE_PASSWORD")\n'
                  '            keyAlias System.getenv("KEY_ALIAS")\n'
                  '            keyPassword System.getenv("KEY_PASSWORD")\n'
                  '        }\n'
                  '    }\n'
              )
              s, n = re.subn(r'(?m)^([ \t]*android[ \t]*\{[ \t]*)$', r'\1\n' + block, s, count=1)
              assert n == 1, 'android { block not found'
          # 2. versionCode = run number (must always increase for updates)
          s, n = re.subn(r'versionCode\s+\d+', 'versionCode ' + run_number, s, count=1)
          assert n == 1, 'versionCode not found'
          # 3. versionName stays 1.0
          s, n = re.subn(r'versionName\s+"[^"]*"', 'versionName "1.0"', s, count=1)
          assert n == 1, 'versionName not found'
          # 4. wire the release build type to the signing config
          if 'signingConfig signingConfigs.release' not in s:
              m = re.search(r'(?m)^(.*buildTypes[ \t]*\{[ \t]*)$', s)
              assert m, 'buildTypes block not found'
              m2 = re.search(r'(?m)^([ \t]*)release[ \t]*\{[ \t]*$', s[m.end():])
              assert m2, 'release block not found'
              indent = m2.group(1) + '    '
              pos = m.end() + m2.end()
              s = s[:pos] + '\n' + indent + 'signingConfig signingConfigs.release' + s[pos:]
          p.write_text(s)
          print('release signing configured, versionCode =', run_number)
          EOF

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Premium-App-Store-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Har build ka APK ek hi fixed link par — purane users yahi se update honge
      # Fixed link: https://github.com/SumitYadav06/Premium/releases/download/store-latest/Apna.Jugaad.apk
      - name: Rename APK to Apna.Jugaad.apk
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Apna.Jugaad.apk

      - name: Publish APK on fixed download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-latest
          name: Apna Jugaad Store - Latest APK
          body: |
            Hamesha ka sabse naya store APK. Ye link kabhi nahi badalta —
            website aur purana app isi link se update hota hai.
          files: android/app/build/outputs/apk/release/Apna.Jugaad.apk
