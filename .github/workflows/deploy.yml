name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create PWA manifest
        run: |
          cp app-icon.png dist/app-icon.png

          cat > dist/manifest.webmanifest <<'EOF'
          {
            "name": "Premium App Store",
            "short_name": "Premium App Store",
            "start_url": "/Premium/",
            "scope": "/Premium/",
            "display": "standalone",
            "background_color": "#020617",
            "theme_color": "#020617",
            "icons": [
              {
                "src": "/Premium/app-icon.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

      - name: Add PWA settings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("dist/index.html")
          s = p.read_text()

          s = s.replace(
              "</head>",
              '<link rel="manifest" href="/Premium/manifest.webmanifest">'
              '<meta name="theme-color" content="#020617">'
              '<meta name="mobile-web-app-capable" content="yes">'
              '<meta name="apple-mobile-web-app-capable" content="yes">'
              '<meta name="apple-mobile-web-app-title" content="Premium App Store">'
              '<link rel="apple-touch-icon" href="/Premium/app-icon.png">'
              "</head>"
          )

          p.write_text(s)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
