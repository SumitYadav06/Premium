apply plugin: 'com.android.library'

android {
    namespace 'com.premium.unityads'
    // Capacitor 8 host app targets SDK 35; the library matches it
    // (the games' Capacitor 6 plugin used 34). A library compileSdk
    // below the host app's is fine.
    compileSdk 35
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':capacitor-android')
    // Capacitor's Plugin.getActivity() returns AppCompatActivity, so the
    // plugin module needs appcompat on its own compile classpath
    // (capacitor-android does not expose it transitively). Without this,
    // :premium-unity-ads:compileReleaseJavaWithJavac fails with
    // "cannot access AppCompatActivity" (Dripply run #20).
    api 'androidx.appcompat:appcompat:1.7.0'
    // Unity Ads Android SDK 4.x (docs.unity.com, SDK 4.18.0 API) —
    // same version as the games.
    implementation 'com.unity3d.ads:unity-ads:4.18.0'
}
